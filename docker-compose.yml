# Seluruh aplikasi SPK Zakat: MySQL + Go API + frontend SvelteKit.
#   docker compose --env-file .env up -d --build
# Buka http://localhost:3101 (hanya 127.0.0.1). Semua service hidup lagi otomatis
# setelah laptop dinyalakan (restart: unless-stopped + service Docker aktif saat boot).
#
# MySQL khusus project ini (development & test integrasi).
# Port diikat ke 127.0.0.1 supaya tidak terbuka ke jaringan.
# Container lain di mesin ini (mis. payment_mysql di 3307) tidak disentuh.
services:
  mysql:
    image: mysql:8.0
    container_name: spkzakat-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?isi MYSQL_ROOT_PASSWORD di .env (lihat .env.example)}
      MYSQL_DATABASE: spkzakat
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    ports:
      - "127.0.0.1:${MYSQL_PORT:-33070}:3306"
    volumes:
      - spkzakat-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Go API: hanya terjangkau dari jaringan compose (tanpa `ports`), karena API
  # mempercayai X-Real-IP dari SvelteKit. DSN memakai host `mysql` (nama service),
  # BUKAN DATABASE_URL di .env yang menunjuk 127.0.0.1:33070 untuk pemakaian dari host.
  api:
    build: ./backend
    container_name: spkzakat-api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DATABASE_URL: root:${MYSQL_ROOT_PASSWORD}@tcp(mysql:3306)/spkzakat
      NIK_ENCRYPTION_KEY: ${NIK_ENCRYPTION_KEY:?isi NIK_ENCRYPTION_KEY di .env}
      NIK_HMAC_KEY: ${NIK_HMAC_KEY:?isi NIK_HMAC_KEY di .env}
      ADDR: 0.0.0.0:8090
      # false karena diakses lewat http://localhost; wajib true bila sudah di belakang HTTPS.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Donasi online. PAYMENT_PROVIDER kosong = halaman /donasi nonaktif (lihat .env.example).
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-}
      MIDTRANS_SERVER_KEY: ${MIDTRANS_SERVER_KEY:-}
      MIDTRANS_SNAP_URL: ${MIDTRANS_SNAP_URL:-}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3101}
      # Email ke Ketua saat donasi online diterima. SMTP_HOST kosong = nonaktif (lihat .env.example).
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      NOTIF_EMAIL_KETUA: ${NOTIF_EMAIL_KETUA:-}
      # Kop email dan PDF kuitansi: identitas masjid yang sama dengan frontend (satu sumber, .env).
      PUBLIC_MASJID_NAMA: ${PUBLIC_MASJID_NAMA:-Masjid Jami Al-Barokah}
      PUBLIC_MASJID_ALAMAT: ${PUBLIC_MASJID_ALAMAT:-}
      PUBLIC_MASJID_KONTAK: ${PUBLIC_MASJID_KONTAK:-}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8090/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build: ./frontend
    container_name: spkzakat-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_URL: http://api:8090
      # Harus sama persis dengan alamat yang diketik di browser (cek CSRF).
      ORIGIN: ${WEB_ORIGIN:-http://localhost:3101}
      PUBLIC_MASJID_NAMA: ${PUBLIC_MASJID_NAMA:-Masjid Jami Al-Barokah}
      # Alamat/kontak diisi di .env. Bawaannya KOSONG (bukan contoh palsu): yang kosong tidak tampil
      # di footer landing, sedangkan kop laporan/kuitansi hanya memuat yang terisi.
      PUBLIC_MASJID_ALAMAT: ${PUBLIC_MASJID_ALAMAT:-}
      PUBLIC_MASJID_KONTAK: ${PUBLIC_MASJID_KONTAK:-}
      # Logo masjid (berkas di frontend/static/, perlu build ulang). Kosong = logo bawaan /logo-masjid.jpg.
      PUBLIC_MASJID_LOGO: ${PUBLIC_MASJID_LOGO:-}
      # Foto hero landing (opsional) dan koordinat masjid untuk jadwal salat (bawaan: Pamulang).
      PUBLIC_MASJID_FOTO: ${PUBLIC_MASJID_FOTO:-}
      PUBLIC_MASJID_LINTANG: ${PUBLIC_MASJID_LINTANG:-}
      PUBLIC_MASJID_BUJUR: ${PUBLIC_MASJID_BUJUR:-}
      # Client Key Midtrans (publik) untuk Snap popup di /donasi. Kosong = muzaki dialihkan
      # ke halaman bayar Midtrans biasa.
      PUBLIC_MIDTRANS_CLIENT_KEY: ${PUBLIC_MIDTRANS_CLIENT_KEY:-}
    ports:
      # 3100 sudah dipakai payment_loki (project lain) di mesin ini, jadi 3101.
      # Ganti WEB_PORT dan WEB_ORIGIN bersamaan di .env bila ingin port lain.
      - "127.0.0.1:${WEB_PORT:-3101}:3000"

volumes:
  spkzakat-mysql-data:
